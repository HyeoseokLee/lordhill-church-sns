# S3 + CloudFront에 어드민 프론트를 배포하는 워크플로우
name: Deploy Admin

# main 브랜치에 어드민 코드가 푸시되면 실행
on:
  push:
    branches: [main]
    paths:
      - 'packages/admin-front/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Node.js 설치
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. 의존성 설치
      - name: Install dependencies
        run: npm install --workspace=packages/admin-front

      # 4. 빌드
      - name: Build
        run: npm run build:admin
        env:
          VITE_API_URL: https://api.lordhill-sns.kr

      # 5. AWS 인증
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      # 6. S3에 업로드
      - name: Upload to S3
        run: aws s3 sync packages/admin-front/dist s3://lordhill-sns-admin --delete

      # 7. CloudFront 캐시 무효화
      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.ADMIN_CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
